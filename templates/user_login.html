<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky 99 | Player Login</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head>
<body><main class="login-page"><form class="login-box" method="post"><div class="brand-icon">99</div><div class="badge">PLAYER LOGIN</div><h1>Enter the game</h1><p>Enter your name to start playing.</p>{% if error %}<div class="login-error">{{error}}</div>{% endif %}<label>Your name<input name="username" maxlength="30" required placeholder="Enter your name"></label><button class="main-submit">START GAME <span>→</span></button></form></main></body></html>
