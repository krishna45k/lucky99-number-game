<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky 99</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head>
<body><nav class="nav"><div class="logo"><span>99</span><div><b>Lucky 99</b><small>Number Guessing Game</small></div></div><div class="nav-links"><span class="welcome">Hi, {{username}} 👋</span><a href="{{url_for('result')}}">🏆 Result</a><form method="post" action="{{url_for('user_logout')}}"><button class="logout">Logout</button></form></div></nav>
<section class="hero"><div class="hero-copy"><div class="badge">🎯 NUMBER GUESSING GAME</div><h1>Pick your <em>lucky number.</em></h1><p>Choose any number from <strong>0 to 99</strong> and submit your guess.</p><div class="stats"><div><strong>0–99</strong><span>Range</span></div><div><strong>36h</strong><span>Data Retention</span></div><div><strong>∞</strong><span>Inputs</span></div></div><a class="check-result" href="{{url_for("result")}}">🏆 CHECK RESULT</a></div>
<div class="phone"><div class="phone-top"><span>LUCKY 99</span><span>●●●</span></div><div class="phone-screen"><small>YOUR NUMBER</small><div id="display">—</div><p id="error"></p></div><div class="keypad">
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="soft" id="clearBtn">⌫</button><button data-key="0">0</button><button class="soft" id="resetBtn">C</button></div><button id="submitBtn" class="main-submit">SUBMIT NUMBER <span>→</span></button><div id="toast"></div></div></section>
<footer>Lucky 99 • School Project</footer><script src="{{url_for('static',filename='app.js')}}"></script></body></html>
